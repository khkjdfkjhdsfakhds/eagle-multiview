<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>软件更新</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1f2024;
      --panel: #18191d;
      --line: rgba(247, 248, 248, .08);
      --text: #f7f8f8;
      --soft: #dadadf;
      --muted: #86878d;
      --accent: #0072ef;
      --danger: #f07482;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      padding: 20px 22px 18px;
      font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    header { display: flex; gap: 14px; align-items: flex-start; }
    header img { width: 56px; height: 56px; flex: none; }
    header div { min-width: 0; }
    h1 { margin: 2px 0 6px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
    .sub { margin: 0; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
    .sub.error { color: var(--danger); }
    .notes {
      flex: 1;
      min-height: 0;
      margin: 16px 0 0;
      padding: 10px 14px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--soft);
      line-height: 1.55;
      user-select: text;
    }
    .notes h3 { margin: 10px 0 4px; font-size: 13px; color: var(--text); }
    .notes h3:first-child { margin-top: 2px; }
    .notes p { margin: 4px 0; }
    .notes ul { margin: 4px 0; padding-left: 18px; }
    .spacer { flex: 1; }
    .progress { margin-top: 18px; }
    .bar { height: 6px; border-radius: 3px; background: rgba(247, 248, 248, .1); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .15s linear; }
    .bar.indeterminate i { width: 30%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
    .progress p { margin: 8px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
    footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
    footer label { display: flex; gap: 6px; align-items: center; margin-right: auto; color: var(--muted); white-space: nowrap; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; justify-content: flex-end; }
    button {
      height: 28px;
      padding: 0 14px;
      border: 1px solid rgba(247, 248, 248, .12);
      border-radius: 7px;
      background: #2b2c30;
      color: var(--text);
      font: inherit;
      white-space: nowrap;
      cursor: default;
    }
    button:hover { background: #333438; }
    button.primary { border-color: transparent; background: var(--accent); }
    button.primary:hover { background: #1580f5; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img src="brand-icon.png" alt="">
    <div>
      <h1 id="title">正在检查更新…</h1>
      <p class="sub" id="subtitle"></p>
    </div>
  </header>
  <div class="notes" id="notes" hidden></div>
  <div class="spacer" id="spacer"></div>
  <div class="progress" id="progress" hidden>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <p id="progressText"></p>
  </div>
  <footer>
    <label id="autoLabel"><input type="checkbox" id="autoCheck"> 自动检查更新</label>
    <div class="buttons" id="buttons"></div>
  </footer>
  <script src="update.js"></script>
</body>
</html>
