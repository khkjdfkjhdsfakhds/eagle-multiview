<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' eaglemv: data: https://cdna.artstation.com https://cdnb.artstation.com https://cdnc.artstation.com https://assets.artstation.com; media-src 'self' eaglemv:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Eagle MultiView</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="drag-region"></div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="sidebar-app-title app-title">
        <button id="libraryButton" class="library-switch-button" title="切换资料库" aria-haspopup="true" aria-expanded="false">
          <span class="app-mark"><img src="brand-icon.png" alt=""></span>
          <span class="app-title-copy">
            <span id="windowTitle">Eagle MultiView</span>
            <span class="sidebar-library-label">资源库</span>
          </span>
          <svg class="library-switch-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8.5 4 4 4-4"></path></svg>
        </button>
        <div id="libraryPopover" class="library-popover hidden" role="menu" aria-label="切换资料库">
          <div class="library-popover-title">切换资料库</div>
          <div id="libraryList" class="library-list"><span class="muted">正在读取资料库列表…</span></div>
        </div>
      </div>
      <nav id="folderTree" class="folder-tree"></nav>
    </aside>

    <section class="content-panel">
      <section class="toolbar">
        <div class="search-box">
          <img class="search-icon" src="eagle-assets/ic_search.svg" alt="">
          <input id="searchInput" type="search" placeholder="搜索名称、标签、备注…">
          <kbd>⌘F</kbd>
        </div>
        <div class="filter-control">
          <button id="filterButton" class="filter-button" title="打开筛选器">筛选 <span id="filterCount" class="filter-count hidden">0</span></button>
          <div id="filterPopover" class="filter-popover hidden">
            <div class="filter-popover-heading"><strong>筛选素材</strong><button id="closeFilterButton" type="button" class="popover-close" aria-label="关闭筛选器">×</button></div>
            <label>搜索范围
              <select id="searchScopeFilter" title="限定搜索框匹配的字段">
                <option value="">全部字段</option>
                <option value="name">仅名称</option>
                <option value="tags">仅标签</option>
                <option value="annotation">仅备注</option>
                <option value="url">仅来源</option>
              </select>
            </label>
            <label>文件格式
              <input id="extFilter" list="extensionSuggestions" placeholder="例如 png、pdf、mov" autocomplete="off">
            </label>
            <label>评分
              <select id="ratingFilter" title="评分">
                <option value="">全部评分</option>
                <option value="5">5 星</option><option value="4">4 星</option><option value="3">3 星</option>
                <option value="2">2 星</option><option value="1">1 星</option><option value="0">未评分</option>
              </select>
            </label>
            <label>形状
              <select id="shapeFilter" title="图片形状">
                <option value="">全部形状</option>
                <option value="square">正方形</option>
                <option value="landscape">横向</option>
                <option value="portrait">纵向</option>
                <option value="panoramic-landscape">全景横向</option>
                <option value="panoramic-portrait">全景纵向</option>
              </select>
            </label>
            <label>颜色
              <div id="colorFilter" class="color-filter" title="按素材主色筛选"></div>
            </label>
            <label>文件大小（MB）
              <div class="filter-range">
                <input id="sizeMinFilter" type="number" min="0" step="0.1" inputmode="decimal" placeholder="最小" autocomplete="off" aria-label="最小文件大小（MB）">
                <span class="filter-range-dash" aria-hidden="true">–</span>
                <input id="sizeMaxFilter" type="number" min="0" step="0.1" inputmode="decimal" placeholder="最大" autocomplete="off" aria-label="最大文件大小（MB）">
              </div>
            </label>
            <label>分辨率（百万像素）
              <div class="filter-range">
                <input id="pixelsMinFilter" type="number" min="0" step="0.1" inputmode="decimal" placeholder="最小" autocomplete="off" aria-label="最小百万像素">
                <span class="filter-range-dash" aria-hidden="true">–</span>
                <input id="pixelsMaxFilter" type="number" min="0" step="0.1" inputmode="decimal" placeholder="最大" autocomplete="off" aria-label="最大百万像素">
              </div>
            </label>
            <label>添加日期
              <div class="filter-range">
                <input id="addedFromFilter" type="date" autocomplete="off" aria-label="添加日期起">
                <span class="filter-range-dash" aria-hidden="true">–</span>
                <input id="addedToFilter" type="date" autocomplete="off" aria-label="添加日期止">
              </div>
            </label>
            <label>备注包含
              <input id="annotationFilter" placeholder="筛选备注" autocomplete="off">
            </label>
            <label>来源包含
              <input id="urlFilter" placeholder="筛选来源 URL" autocomplete="off">
            </label>
            <label>标签
              <div id="filterTagEditor" class="tag-editor tag-filter-editor" title="标签筛选">
                <div id="filterTagChips" class="tag-chips"></div>
                <input id="filterTagInput" placeholder="筛选标签…" autocomplete="off">
              </div>
            </label>
            <button id="toggleTagColorsButton" type="button" class="tag-colors-toggle">管理标签颜色</button>
            <div id="tagColorManager" class="tag-color-manager hidden"></div>
            <button id="saveSmartFolderButton" class="filter-save-smart" type="button">保存为智能文件夹</button>
            <button id="clearFiltersButton" class="filter-clear hidden" title="清除搜索与筛选">清除筛选</button>
          </div>
        </div>
        <div class="toolbar-cluster">
        <div class="toolbar-center">
          <div class="title-actions toolbar-title-actions no-drag">
            <div class="pane-layout-control">
              <button id="paneLayoutButton" class="icon-button pane-layout-button" title="选择分栏布局" aria-label="选择分栏布局" aria-expanded="false">
                <span class="pane-split-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/></svg></span>
              </button>
              <div id="paneLayoutPopover" class="pane-layout-popover hidden" role="menu" aria-label="分栏布局">
                <div class="pane-layout-options">
                  <button type="button" class="pane-layout-option" data-layout="single" title="单栏" aria-label="单栏"><span class="layout-icon layout-icon-single"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="vertical2" title="左右两栏" aria-label="左右两栏"><span class="layout-icon layout-icon-vertical2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M12 2v20"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="horizontal2" title="上下两栏" aria-label="上下两栏"><span class="layout-icon layout-icon-horizontal2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M2 12h20"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="grid4" title="四格" aria-label="四格"><span class="layout-icon layout-icon-grid4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M12 2v20M2 12h20"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="leftStack" title="左大右上下" aria-label="左大右上下"><span class="layout-icon layout-icon-leftStack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M12 2v20M12 12h10"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="rightStack" title="左上下右大" aria-label="左上下右大"><span class="layout-icon layout-icon-rightStack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M12 2v20M2 12h10"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="topStack" title="上大下左右" aria-label="上大下左右"><span class="layout-icon layout-icon-topStack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M2 12h20M12 12v10"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="bottomStack" title="上左右下大" aria-label="上左右下大"><span class="layout-icon layout-icon-bottomStack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M2 12h20M12 2v10"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="horizontal3" title="三行" aria-label="三行"><span class="layout-icon layout-icon-horizontal3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M2 8.667h20M2 15.333h20"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="vertical3" title="三栏" aria-label="三栏"><span class="layout-icon layout-icon-vertical3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M8.667 2v20M15.333 2v20"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="vertical4" title="四栏" aria-label="四栏"><span class="layout-icon layout-icon-vertical4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M7 2v20M12 2v20M17 2v20"/></svg></span></button>
                  <button type="button" class="pane-layout-option" data-layout="horizontal4" title="四行" aria-label="四行"><span class="layout-icon layout-icon-horizontal4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.4"/><path d="M2 7h20M2 12h20M2 17h20"/></svg></span></button>
                </div>
                <div class="pane-layout-footer">
                  <label class="pane-sync-option" title="开启后，全屏预览图片的打开、切换和关闭会在其他分栏同步">
                    <input type="checkbox" id="syncPanesCheckbox" aria-keyshortcuts="Shift+S">
                    <span>全屏预览同步</span>
                    <kbd class="pane-sync-shortcut">⇧S</kbd>
                  </label>
                </div>
              </div>
            </div>
            <div class="view-switcher">
              <button id="toggleSidebarButton" class="icon-button panel-button active" title="显示/隐藏文件夹栏（⌘⇧L）" aria-label="显示或隐藏文件夹栏">
                <img class="eagle-ui-icon" src="eagle-assets/ic_toggle-sidebar.svg" alt="">
              </button>
              <button id="toggleInspectorButton" class="icon-button panel-button active" title="显示/隐藏检查器（⌘⇧I）" aria-label="显示或隐藏检查器">
                <img class="eagle-ui-icon mirror-x" src="eagle-assets/ic_toggle-sidebar.svg" alt="">
              </button>
            </div>
            <button id="newButton" class="icon-button new-window-button new-create-button" title="新建文件夹或文件（⌥N 新建文件夹）" aria-haspopup="menu" aria-expanded="false">
              <svg class="ui-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M3 10h14"></path></svg>
              <span>新建</span><span class="new-button-chevron" aria-hidden="true">⌄</span>
            </button>
            <button id="currentEaglePathButton" class="icon-button new-window-button current-eagle-path-button" title="跳转到当前 Eagle 路径" aria-label="跳转到当前 Eagle 路径">
              <svg class="ui-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.8 6.4h5l1.6 1.8h7.8v7.4c0 .9-.7 1.6-1.6 1.6H4.4c-.9 0-1.6-.7-1.6-1.6z"></path><path d="M12.4 3.2 16 6.8l-3.6 3.6M15.7 6.8H9.8"></path></svg>
              <span>Eagle 路径</span>
            </button>
            <button id="refreshAllPanesButton" class="icon-button toolbar-refresh-button" type="button" title="刷新所有分栏" aria-label="刷新所有分栏" aria-busy="false">
              <svg class="ui-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.2 8.2A6.5 6.5 0 1 0 16.5 12M16.2 4.7v3.8h-3.8"></path></svg>
            </button>
          </div>
        </div>
        <span class="toolbar-control-divider" aria-hidden="true"></span>
        <label class="size-control" title="缩略图大小">小<input id="sizeSlider" type="range" min="110" max="260" value="168">大</label>
        </div>
      </section>
      <div id="paneLayout" class="pane-layout" data-layout="single"></div>
    </section>

    <div id="sidebarResizer" class="workspace-resizer workspace-resizer-sidebar" data-resizer="sidebar" role="separator" aria-orientation="vertical" aria-label="调整文件夹栏宽度"></div>
    <div id="inspectorResizer" class="workspace-resizer workspace-resizer-inspector" data-resizer="inspector" role="separator" aria-orientation="vertical" aria-label="调整检查器宽度"></div>

    <div id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true"></div>
    <aside class="inspector">
      <div id="noSelection" class="inspector-empty">
        <div class="inspector-placeholder"><img src="brand-icon.png" alt=""></div>
        <p>选择一个素材查看详情</p>
        <small>多个窗口可以停留在不同文件夹和搜索结果中</small>
      </div>
      <div id="inspectorContent" class="inspector-content hidden">
        <div id="previewBox" class="preview-box"></div>
        <div id="itemPalette" class="item-palette hidden" aria-label="主色调" title="主色调（点击复制色值）"></div>
        <div id="staleBanner" class="stale-banner hidden">此素材已在另一个窗口更新；保存时会检查冲突。</div>
        <section class="inspector-section">
          <div class="inspector-field">
            <input id="itemName" aria-label="名称" placeholder="名称" autocomplete="off">
          </div>
          <div class="inspector-field">
            <div id="itemTagEditor" class="tag-editor">
              <div id="itemTagChips" class="tag-chips"></div>
              <input id="itemTagInput" aria-label="标签" placeholder="添加标签" autocomplete="off">
            </div>
          </div>
          <div class="inspector-field">
            <select id="itemRating" aria-label="评分">
              <option value="0">未评分</option><option value="1">★</option><option value="2">★★</option>
              <option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option>
            </select>
          </div>
        </section>
        <section class="inspector-section">
          <div class="inspector-field">
            <textarea id="itemAnnotation" aria-label="备注" placeholder="添加注释" rows="1"></textarea>
          </div>
          <div class="inspector-field url-field">
            <input id="itemURL" aria-label="来源" placeholder="http://" autocomplete="off">
            <div class="url-actions">
              <button id="openURLButton" type="button" class="small-action" title="在浏览器中打开来源网址" disabled>打开</button>
              <button id="copyURLButton" type="button" class="small-action" title="复制来源网址" disabled>复制</button>
            </div>
          </div>
        </section>
        <section id="itemCommentsSection" class="inspector-section comments-section">
          <div class="comments-heading"><h3>评论与标注</h3><button id="addCommentButton" type="button" class="small-action" title="添加评论">添加</button></div>
          <div id="itemComments" class="item-comments"><span class="muted">正在读取…</span></div>
        </section>
        <section class="inspector-section">
          <h3>文件信息</h3>
          <div id="itemMeta" class="item-meta"></div>
        </section>
        <section id="generationMetadataSection" class="inspector-section generation-metadata-section hidden">
          <div class="generation-metadata-heading">
            <h3>生成元数据</h3>
            <span id="generationMetadataFormat" class="metadata-format"></span>
          </div>
          <div id="generationMetadata" class="generation-metadata"></div>
        </section>
        <div class="inspector-actions">
          <button id="pinButton" class="secondary-button" title="素材置顶只在普通文件夹中生效">置顶</button>
          <button id="openDefaultButton" class="secondary-button" title="快捷键：⇧Enter">默认应用打开</button>
          <button id="finderButton" class="secondary-button">在 Finder 中显示</button>
          <button id="customThumbnailButton" class="secondary-button" title="通过 Eagle API 设置自定义缩略图">自定义缩略图</button>
        </div>
        <button id="trashButton" class="danger-link">移入废纸篓</button>
      </div>
      <div id="multiSelection" class="multi-selection hidden">
        <h2><span id="multiCount">0</span> 个素材</h2>
        <p>将所选素材拖到左侧文件夹即可批量归类。</p>
        <label id="sharedTagsSection" class="shared-tags-section hidden">共同标签
          <div id="sharedTagChips" class="tag-chips shared-tag-chips"></div>
        </label>
        <label>批量设置评分
          <select id="batchRating">
            <option value="">选择评分…</option>
            <option value="0">未评分</option>
            <option value="1">★</option>
            <option value="2">★★</option>
            <option value="3">★★★</option>
            <option value="4">★★★★</option>
            <option value="5">★★★★★</option>
          </select>
        </label>
        <label>批量添加标签
          <div id="batchTagEditor" class="tag-editor">
            <div id="batchTagChips" class="tag-chips"></div>
            <input id="batchTagInput" placeholder="输入标签后按 Return" autocomplete="off">
          </div>
        </label>
        <button id="batchTagButton" class="primary-button">添加标签</button>
        <button id="batchTrashButton" class="danger-button">移入废纸篓</button>
        <button id="clearSelectionButton" class="secondary-button" title="取消当前多选（Esc）">取消选择</button>
      </div>
    </aside>
  </main>

  <div id="offlineBanner" class="offline-banner hidden" role="status" aria-live="polite"></div>

  <div id="selectionBar" class="selection-bar hidden" role="toolbar" aria-label="所选素材">
    <div class="selection-bar-info">
      <span id="selectionBarTitle" class="selection-bar-title"></span>
      <span id="selectionBarMeta" class="selection-bar-meta"></span>
    </div>
    <button id="selectionBarPreview" type="button" class="selection-bar-action">预览</button>
    <button id="selectionBarDetails" type="button" class="selection-bar-action">详情</button>
    <button id="selectionBarClear" type="button" class="selection-bar-action selection-bar-clear" aria-label="取消选择">取消</button>
  </div>

  <footer class="statusbar">
    <span id="connectionDot" class="connection-dot"></span>
    <span id="connectionText">正在连接 Eagle…</span>
    <span class="status-spacer"></span>
    <span id="scrollStatus">已载入 0 / 0</span>
    <span class="status-divider">·</span>
    <span id="syncText">等待同步</span>
  </footer>

  <div id="previewModal" class="preview-modal hidden">
    <div id="slideshowControls" class="slideshow-controls">
      <button id="slideshowToggle" class="slideshow-button" type="button" title="幻灯片播放（S）" aria-pressed="false" aria-label="幻灯片播放">▶</button>
      <select id="slideshowInterval" class="slideshow-interval" aria-label="幻灯片间隔">
        <option value="2000">2 秒</option>
        <option value="4000">4 秒</option>
        <option value="6000">6 秒</option>
        <option value="10000">10 秒</option>
      </select>
      <button id="previewBackground" class="slideshow-button preview-view-button" type="button" aria-label="透明区域背景"><span class="preview-bg-chip" aria-hidden="true"></span></button>
      <button id="previewGrayscale" class="slideshow-button preview-view-button" type="button" title="灰度查看（G）" aria-label="灰度查看" aria-pressed="false">灰</button>
    </div>
    <button id="closePreview" class="modal-close">×</button>
    <button id="prevPreview" class="modal-nav prev">‹</button>
    <div id="modalMedia" class="modal-media"></div>
    <div id="modalRating" class="modal-rating" role="group" aria-label="评分（按 0-5）"></div>
    <div id="modalCaption" class="modal-caption"></div>
    <button id="nextPreview" class="modal-nav next">›</button>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="previewSyncNotice" class="toast preview-sync-notice hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="contextMenu" class="context-menu hidden" role="menu" aria-label="素材操作菜单"></div>
  <div id="trashDialog" class="trash-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="trashDialogTitle">
    <div class="trash-dialog-card">
      <h2 id="trashDialogTitle">删除素材</h2>
      <p id="trashDialogMessage"></p>
      <div class="trash-dialog-actions">
        <button id="trashRemoveButton" class="secondary-button">从当前文件夹移除</button>
        <button id="trashDeleteButton" class="danger-button">删除素材</button>
        <button id="trashCancelButton" class="secondary-button">取消</button>
      </div>
    </div>
  </div>
  <div id="duplicateDialog" class="trash-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="duplicateDialogTitle">
    <div class="trash-dialog-card duplicate-dialog-card">
      <h2 id="duplicateDialogTitle">发现已有素材</h2>
      <p id="duplicateDialogMessage"></p>
      <div class="trash-dialog-actions">
        <button id="duplicateUseExistingButton" class="primary-button">使用现有素材</button>
        <button id="duplicateKeepBothButton" class="secondary-button">保留两者</button>
        <button id="duplicateCancelButton" class="secondary-button">取消</button>
      </div>
    </div>
  </div>
  <div id="folderDialog" class="trash-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="folderDialogTitle">
    <form id="folderDialogForm" class="trash-dialog-card folder-dialog-card">
      <h2 id="folderDialogTitle">新建文件夹</h2>
      <label class="folder-dialog-field"><span id="folderDialogFieldLabel">名称</span>
        <input id="folderNameInput" type="text" maxlength="240" autocomplete="off" placeholder="未命名文件夹">
      </label>
      <div class="trash-dialog-actions">
        <button id="folderDialogCreateButton" type="submit" class="primary-button">创建</button>
        <button id="folderDialogCancelButton" type="button" class="secondary-button">取消</button>
      </div>
    </form>
  </div>
  <div id="webAccessDialog" class="trash-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="webAccessTitle">
    <div class="trash-dialog-card web-access-card">
      <h2 id="webAccessTitle">Web 访问</h2>
      <p class="web-access-intro">在手机或平板的浏览器中打开当前资料库。访问密钥保护整库读写权限，建议只在可信局域网或 Tailscale 网络中开启。</p>
      <label class="web-access-toggle"><input id="webAccessEnabled" type="checkbox"> 启用 Web 访问（本机所有网络接口）</label>
      <label class="folder-dialog-field web-access-port-field"><span>端口</span>
        <input id="webAccessPort" type="number" min="1024" max="65535" placeholder="41600">
      </label>
      <div class="web-access-key-row">
        <span>访问密钥</span>
        <code id="webAccessKey">—</code>
        <button id="webAccessCopyKey" type="button" class="small-action" title="复制访问密钥">复制</button>
        <button id="webAccessResetKey" type="button" class="small-action" title="生成新密钥并踢掉所有已登录的网页端">重置</button>
      </div>
      <label class="web-access-toggle web-access-nokey"><input id="webAccessNoKey" type="checkbox"> 免密访问（同一网络的任何设备都能读写资料库，仅建议在 Tailscale 等可信网络开启）</label>
      <div id="webAccessAddresses" class="web-access-addresses"></div>
      <div id="webAccessStatus" class="web-access-status muted"></div>
      <div class="trash-dialog-actions">
        <button id="webAccessSaveButton" class="primary-button">应用</button>
        <button id="webAccessCloseButton" type="button" class="secondary-button">关闭</button>
      </div>
    </div>
  </div>
  <datalist id="tagSuggestions"></datalist>
  <datalist id="extensionSuggestions">
    <option value="jpg"></option><option value="jpeg"></option><option value="png"></option><option value="webp"></option>
    <option value="gif"></option><option value="svg"></option><option value="heic"></option><option value="tif"></option><option value="tiff"></option>
    <option value="psd"></option><option value="pdf"></option><option value="txt"></option><option value="mp4"></option><option value="mov"></option>
    <option value="webm"></option><option value="mp3"></option><option value="wav"></option><option value="aiff"></option>
  </datalist>
  <script src="folder-navigation.js"></script>
  <script src="eagle-logical-path.js"></script>
  <script src="pane-layout-popover-position.js"></script>
  <script src="drag-drop.js"></script>
  <script src="marquee.js"></script>
  <script src="grid-gestures.js"></script>
  <script src="query-spec.js"></script>
  <script src="pane-state.js"></script>
  <script src="sort-memory.js"></script>
  <script src="smart-folder.js"></script>
  <script src="operation-state.js"></script>
  <script src="window-target.js"></script>
  <script src="window-actions.js"></script>
  <script src="window-router.js"></script>
  <script src="feature-ui.js"></script>
  <script src="manual-order-ui.js"></script>
  <script src="thumbnail-ui.js"></script>
  <script src="site-import-ui.js"></script>
  <script src="renderer.js"></script>
</body>
